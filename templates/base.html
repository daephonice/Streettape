<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="{% block viewport %}width=device-width, initial-scale=1.0, viewport-fit=cover{% endblock %}">
  <title>{% block title %}StreetTape — mark vs tape for BNB tokenized stocks{% endblock %}</title>
  <meta name="description" content="Mark vs tape for bStocks, Ondo and xStocks on BNB Chain.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@1,400&family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/desk.css?v={{ static_v('css/desk.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}{% if nav %} has-nav{% endif %}">
  {% block header %}{% endblock %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% block footer %}{% endblock %}

  {% if nav %}{% include "_nav.html" %}{% endif %}

  <script src="/static/js/wallet.js?v={{ static_v('js/wallet.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
